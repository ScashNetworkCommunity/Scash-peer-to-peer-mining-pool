name: Deploy Scash P2Pool Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches: ["master", "main"]
    paths:
      - "cloudflare-stats-worker/**"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject D1 Database ID from GitHub Secret
        run: |
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}/" cloudflare-stats-worker/wrangler.toml

      - name: Deploy Worker + Durable Object Relay
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: "cloudflare-stats-worker"
