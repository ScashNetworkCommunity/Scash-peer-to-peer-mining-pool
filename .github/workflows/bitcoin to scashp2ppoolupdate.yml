puminingreal --jq .id 2>/dev/null || true)\nif [[ \"$ISC_ID\" =~ ^[0-9]+$ ]]; then\n  ISC_EMAIL=\"${ISC_ID}+iscpuminingreal@users.noreply.github.com\"\nelse\n  ISC_EMAIL=\"iscpuminingreal@users.noreply.github.com\"\nfi\necho \"SCASH_ISC_EMAIL=$ISC_EMAIL\" >> \"$GITHUB_ENV\"\nexport GIT_AUTHOR_NAME='iscpuminingreal'\nexport GIT_AUTHOR_EMAIL=\"$ISC_EMAIL\"\nexport GIT_COMMITTER_NAME='iscpuminingreal'\nexport GIT_COMMITTER_EMAIL=\"$ISC_EMAIL\"\ngit config user.name 'iscpuminingreal'\ngit config user.email \"$ISC_EMAIL\"\ngit add -A README.md READ-ME-FIRST.txt miner/README-MINER.txt scash.conf.example THIRD_PARTY_NOTICES.md Start-Scash-P2Pool-Windows.bat Stop-Scash-P2Pool-Windows.bat\ngit add -A README_ZH_CN.md README_ZH_HK.md stop-scash-p2pool-linux.sh start-public-seed-linux.sh cloudflare-stats-worker/worker.js cloudflare-stats-worker/wrangler.toml\ngit add -A start-scash-p2pool-linux.sh start_scash_p2pool.py p2pool tests/test_live_integration.py cpp/launcher web-static/index.html\nHAS_ISC=$(git log --format='%ae' HEAD 2>/dev/null | { grep -ic 'iscpuminingreal' || true; })\nif git diff --staged --quiet && [ \"$HAS_ISC\" -eq 0 ]; then\n  printf '\n- **Scash P2Pool QtKawaii Integration & Maintenance**: [`@iscpuminingreal`](https://github.com/iscpuminingreal)\n' >> THIRD_PARTY_NOTICES.md\n  git add THIRD_PARTY_NOTICES.md\nfi\nif ! git diff --staged --quiet; then\n  git commit -m 'v0.4.0: add Cloudflare DO WebSocket CGNAT relay, fix scashd tip sync, PyPy bugs & PoW cache [skip ci]'\n  git pull --rebase origin master\n  git push origin master\nfi\nTOTAL_COMMITS=$(git rev-list --count HEAD 2>/dev/null || echo 0)\nIS_FORK=$(gh api \"repos/$GITHUB_REPOSITORY\" --jq .fork 2>/dev/null || echo 'unknown')\necho \"[CONTRIBUTOR-CHECK] Repo fork=$IS_FORK | Total commits=$TOTAL_COMMITS | Added/verified contributor=iscpuminingreal <$ISC_EMAIL> (all prior contributors preserved!)\""},{"name":"Publish Scash P2Pool v0.4.0 Pre-release (English + Chinese Release Notes)","run":"cat <<'EOF' 