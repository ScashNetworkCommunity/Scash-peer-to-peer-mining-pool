{"name":"Build Standalone Scash P2Pool v0.2.0-beta.1 (CMake RandomX + Bundled Runtime)","on":{"workflow_dispatch":{},"push":{"branches":["master","main"],"paths":[".github/workflows/**"]}},"permissions":{"contents":"write"},"jobs":{"build-linux-and-update-master":{"runs-on":"ubuntu-latest","steps":[{"name":"Checkout master","uses":"actions/checkout@v4","with":{"ref":"master","fetch-depth":0}},{"name":"Apply Consensus Fixes, Compile Scash RandomX (librandomx.so), Test Genesis & Push to master","run":"python3 -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\" && git clone --depth 1 -b scash https://github.com/ScashNetworkCommunity/RandomX.git /tmp/scash-rx && cmake -S /tmp/scash-rx -B /tmp/scash-rx/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DARCH=default && cmake --build /tmp/scash-rx/build --config Release -j 4 && cp /tmp/scash-rx/build/librandomx.so* ./librandomx.so && python3 tests/test_scash_p2pool_stack.py && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add p2pool start_scash_p2pool.py Start-Scash-P2Pool-Windows.bat start-scash-p2pool-linux.sh tests README.md miner/README-MINER.txt && (git diff --staged --quiet || git commit -m 'Consensus-verified Scash RandomX + 112B header + dual Stratum + standalone runtime build [skip ci]') && git push origin master && git push origin master:scash-kawaii"},{"name":"Bundle Standalone Linux x64 Archive (~30 MB with Portable PyPy + Twisted + librandomx.so)","run":"python3 -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\" && mkdir -p dist && rm -rf /tmp/pkg && mkdir -p /tmp/pkg/Scash-P2Pool-v0.2.0-beta.1 && rsync -a --exclude='.git' --exclude='dist' . /tmp/pkg/Scash-P2Pool-v0.2.0-beta.1/ && tar -czf dist/Scash-P2Pool-v0.2.0-beta.1-Linux-x64.tar.gz -C /tmp/pkg Scash-P2Pool-v0.2.0-beta.1 && ls -lh dist/"},{"name":"Upload Linux Artifact","uses":"actions/upload-artifact@v4","with":{"name":"linux-standalone","path":"dist/Scash-P2Pool-v0.2.0-beta.1-Linux-x64.tar.gz"}}]},"build-windows-standalone":{"runs-on":"windows-latest","needs":["build-linux-and-update-master"],"steps":[{"name":"Checkout updated master","uses":"actions/checkout@v4","with":{"ref":"master"}},{"name":"Compile Native Scash randomx.dll (MSVC CMake) & Verify Mainnet Genesis Block","shell":"bash","run":"git clone --depth 1 -b scash https://github.com/ScashNetworkCommunity/RandomX.git ../scash-rx && cmake -S ../scash-rx -B ../scash-rx/build -DBUILD_SHARED_LIBS=ON -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DARCH=default && cmake --build ../scash-rx/build --config Release && find ../scash-rx/build -iname '*randomx*.dll' -exec cp {} ./randomx.dll \\; && ls -lh ./randomx.dll && python tests/test_scash_p2pool_stack.py"},{"name":"Bundle Standalone Windows x64 Zip (~30 MB with Portable PyPy + Twisted + randomx.dll, Zero WinRing0)","shell":"bash","run":"python -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\" && mkdir -p dist && python -c \"import os, zipfile; zf = zipfile.ZipFile('dist/Scash-P2Pool-v0.2.0-beta.1-Windows-x64.zip', 'w', zipfile.ZIP_DEFLATED); [zf.write(os.path.join(r, fn), os.path.join('Scash-P2Pool-v0.2.0-beta.1', os.path.relpath(os.path.join(r, fn), '.'))) for r, ds, fs in os.walk('.') if not any(p in r.split(os.sep) for p in ('.git', 'dist')) for fn in fs]; zf.close()\" && ls -lh dist/"},{"name":"Upload Windows Artifact","uses":"actions/upload-artifact@v4","with":{"name":"windows-standalone","path":"dist/Scash-P2Pool-v0.2.0-beta.1-Windows-x64.zip"}}]},"publish-prerelease-v020":{"runs-on":"ubuntu-latest","needs":["build-linux-and-update-master","build-windows-standalone"],"env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"steps":[{"name":"Download Compiled Windows & Linux Standalone Packages","uses":"actions/download-artifact@v4","with":{"path":"release_assets","merge-multiple":true}},{"name":"Generate SHA256SUMS, Remove Flagged v0.1.0-beta.1 & Publish Clean v0.2.0-beta.1 Pre-Release","r