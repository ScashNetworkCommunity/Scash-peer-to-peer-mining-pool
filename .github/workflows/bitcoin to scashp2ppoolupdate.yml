-p2pool-0.3.5-win64*.zip"}}]},"publish-release-v035":{"runs-on":"ubuntu-latest","needs":["build-linux-standalone","build-windows-standalone"],"env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"steps":[{"name":"Checkout master","uses":"actions/checkout@v4","with":{"ref":"master","fetch-depth":0}},{"name":"Download Verified Windows & Linux Standalone Packages","uses":"actions/download-artifact@v4","with":{"path":"release_assets","merge-multiple":true}},{"name":"Sync Verified v0.3.5 Repo Sources & Ensure iscpuminingreal Contributor Attribution (Preserving Prior History)","run":"mkdir -p /tmp/b6_sync miner cpp cloudflare-stats-worker tests web-static\ntar -xzf release_assets/scash-p2pool-0.3.5-x86_64-pc-linux-gnu.tgz -C /tmp/b6_sync --strip-components=1\nrm -rf p2pool cpp/launcher\nfor p in README.md READ-ME-FIRST.txt miner/README-MINER.txt scash.conf.example THIRD_PARTY_NOTICES.md Start-Scash-P2Pool-Windows.bat Stop-Scash-P2Pool-Windows.bat start-scash-p2pool-linux.sh;\ndo cp -a \"/tmp/b6_sync/$p\" \"$p\"; done\nfor p in README_ZH_CN.md README_ZH_HK.md stop-scash-p2pool-linux.sh start-public-seed-linux.sh cloudflare-stats-worker/worker.js; do cp -a \"/tmp/b6_sync/$p\" \"$p\"; done\nfor p in start_scash_p2pool.py p2pool tests/test_live_integration.py cpp/launcher web-static/index.html;\ndo cp -a \"/tmp/b6_sync/$p\" \"$p\"; done\nrm -rf /tmp/b6_sync p2pool/p2pool cpp/launcher/launcher\nfind p2pool tests -name '*.pyc' -delete\nISC_ID=$(gh api users/iscpuminingreal --jq .id 2>/dev/null || true)\nif [[ \"$ISC_ID\" =~ ^[0-9]+$ ]]; then\n  ISC_EMAIL=\"${ISC_ID}+iscpuminingreal@users.noreply.github.com\"\nelse\n  ISC_EMAIL=\"iscpuminingreal@users.noreply.github.com\"\nfi\necho \"SCASH_ISC_EMAIL=$ISC_EMAIL\" >> \"$GITHUB_ENV\"\nexport GIT_AUTHOR_NAME='iscpuminingreal'\nexport GIT_AUTHOR_EMAIL=\"$ISC_EMAIL\"\nexport GIT_COMMITTER_NAME='iscpuminingreal'\nexport GIT_COMMITTER_EMAIL=\"$ISC_EMAIL\"\ngit config user.name 'iscpuminingreal'\ngit config user.email \"$ISC_EMAIL\"\ngit add