{"name":"Build Standalone Scash P2Pool + ScashNetworkCommunity/xmrigCC v0.2.0-beta.1","on":{"workflow_dispatch":{},"push":{"branches":["master","main"],"paths":[".github/workflows/**"]}},"permissions":{"contents":"write"},"jobs":{"build-linux-and-update-master":{"runs-on":"ubuntu-latest","steps":[{"name":"Checkout master","uses":"actions/checkout@v4","with":{"ref":"master","fetch-depth":0}},{"name":"Compile Scash RandomX (librandomx.so), Test Genesis & Push Updated Source to master","run":"sudo apt-get update && sudo apt-get install -y build-essential cmake libuv1-dev libhwloc-dev libssl-dev && python3 -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\" && git clone --depth 1 -b scash https://github.com/ScashNetworkCommunity/RandomX.git /tmp/scash-rx && python3 -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\" /tmp/scash-rx && cmake -S /tmp/scash-rx -B /tmp/scash-rx/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON -DARCH=default && cmake --build /tmp/scash-rx/build --config Release -j $(nproc) && cp /tmp/scash-rx/build/librandomx.so* ./librandomx.so && python3 tests/test_scash_p2pool_stack.py && git config user.name 'github-actions[bot]' && git config user.email '41898282+github-actions[bot]@users.noreply.github.com' && git add cpp p2pool start_scash_p2pool.py Start-Scash-P2Pool-Windows.bat start-scash-p2pool-linux.sh tests README.md miner/README-MINER.txt && (git diff --staged --quiet || git commit -m 'Integrate ScashNetworkCommunity/xmrigCC (-DWITH_MSR=OFF) + fix PyPy typing install [skip ci]') && git push origin master && git push origin master:scash-kawaii"},{"name":"Compile ScashNetworkCommunity/xmrigCC (Linux x64, -DWITH_MSR=OFF) & Bundle Standalone ~35 MB Archive","run":"git clone --depth 1 https://github.com/ScashNetworkCommunity/xmrigCC.git /tmp/xmrigCC && cmake -S /tmp/xmrigCC -B /tmp/xmrigCC/build -DCMAKE_BUILD_TYPE=Release -DWITH_MSR=OFF -DWITH_RANDOMX=ON -DWITH_ASM=ON -DWITH_CC_SERVER=OFF -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_NVML=OFF -DWITH_ADL=OFF -DWITH_KAWPOW=OFF -DWITH_GHOSTRIDER=OFF -DWITH_CN_LITE=OFF -DWITH_CN_HEAVY=OFF -DWITH_CN_PICO=OFF -DWITH_CN_FEMTO=OFF -DWITH_CN_GPU=OFF -DWITH_ARGON2=OFF && cmake --build /tmp/xmrigCC/build --config Release -j $(nproc) && find /tmp/xmrigCC/build -maxdepth 3 -type f \\( -name 'xmrigMiner' -o -name 'xmrigDaemon' \\) -exec cp {} ./miner/ \\; && chmod +x ./miner/xmrig* && ./miner/xmrigMiner --version && python3 -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\" && mkdir -p dist && rm -rf /tmp/pkg && mkdir -p /tmp/pkg/Scash-P2Pool-v0.2.0-beta.1 && rsync -a --exclude='.git' --exclude='dist' . /tmp/pkg/Scash-P2Pool-v0.2.0-beta.1/ && tar -czf dist/Scash-P2Pool-v0.2.0-beta.1-Linux-x64.tar.gz -C /tmp/pkg Scash-P2Pool-v0.2.0-beta.1 && ls -lh dist/ ./miner/"},{"name":"Upload Linux Standalone Artifact","uses":"actions/upload-artifact@v4","with":{"name":"linux-standalone","path":"dist/Scash-P2Pool-v0.2.0-beta.1-Linux-x64.tar.gz"}}]},"build-windows-standalone":{"runs-on":"windows-latest","needs":["build-linux-and-update-master"],"steps":[{"name":"Checkout updated master","uses":"actions/checkout@v4","with":{"ref":"master"}},{"name":"Compile Scash randomx.dll & ScashNetworkCommunity/xmrigCC (Windows x64, -DWITH_MSR=OFF, Zero WinRing0)","shell":"bash","run":"git clone --depth 1 -b scash https://github.com/ScashNetworkCommunity/RandomX.git ../scash-rx && python -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\" ../scash-rx && cmake -S ../scash-rx -B ../scash-rx/build -DBUILD_SHARED_LIBS=ON -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON -DARCH=default && cmake --build ../scash-rx/build --config Release && find ../scash-rx/build -iname '*randomx*.dll' -exec cp {} ./randomx.dll \\; && python tests/test_scash_p2pool_stack.py && git clone --depth 1 https://github.com/xmrig/xmrig-deps.git ../xmrig-deps && if [ -d '../xmrig-deps/msvc2022/x64' ]; then DEPS_DIR=$(cd ../xmrig-deps/msvc2022/x64 && pwd -W); elif [ -d '../xmrig-deps/msvc2019/x64' ]; then DEPS_DIR=$(cd ../xmrig-deps/msvc2019/x64 && pwd -W); else D=$(find ../xmrig-deps -maxdepth 3 -type d -name x64 | grep -i msvc | head -n 1); DEPS_DIR=$(cd $D && pwd -W); fi && git clone --depth 1 https://github.com/ScashNetworkCommunity/xmrigCC.git ../xmrigCC && cmake -S ../xmrigCC -B ../xmrigCC/build -A x64 -DXMRIG_DEPS=\"$DEPS_DIR\" -DCMAKE_BUILD_TYPE=Release -DWITH_MSR=OFF -DWITH_RANDOMX=ON -DWITH_ASM=ON -DWITH_CC_SERVER=OFF -DWITH_OPENCL=OFF -DWITH_CUDA=OFF -DWITH_NVML=OFF -DWITH_ADL=OFF -DWITH_KAWPOW=OFF -DWITH_GHOSTRIDER=OFF -DWITH_CN_LITE=OFF -DWITH_CN_HEAVY=OFF -DWITH_CN_PICO=OFF -DWITH_CN_FEMTO=OFF -DWITH_CN_GPU=OFF -DWITH_ARGON2=OFF && cmake --build ../xmrigCC/build --config Release --parallel 4 && find ../xmrigCC/build -maxdepth 4 -type f \\( -iname 'xmrigMiner.exe' -o -iname 'xmrigDaemon.exe' \\) -exec cp {} ./miner/ \\; && rm -f ./miner/*.sys && ls -lh ./miner/ && ./miner/xmrigMiner.exe --version"},{"name":"Bundle Standalone Windows x64 Zip (~35 MB with PyPy + Twisted + randomx.dll + xmrigMiner.exe)","shell":"bash","run":"python -c \"import base64; exec(base64.b64decode('').decode('utf-8'))\" && mkdir -p dist && python -c \"import os, zipfile; zf = zipfile.ZipFile('dist/Scash-P2Pool-v0.2.0-beta.1-Windows-x64.zip', 'w', zipfile.ZIP_DEFLATED); [zf.write(os.path.join(r, fn), os.path.join('Scash-P2Pool-v0.2.0-beta.1', os.path.relpath(os.path.join(r, fn), '.'))) for r, ds, fs in os.walk('.') if not any(p in r.split(os.sep) for p in ('.git', 'dist')) for fn in fs]; zf.close()\" && ls -lh dist/"},{"name":"Upload Windows Standalone Artifact","uses":"actions/upload-artifact@v4","with":{"name":"windows-standalone","path":"dist/Scash-P2Pool-v0.2.0-beta.1-Windows-x64.zip"}}]},"publish-prerelease-v020":{"runs-on":"ubuntu-latest","needs":["build-linux-and-update-master","build-windows-standalone"],"env":{"GH_TOKEN":"${{ secrets.GITHUB_TOKEN }}"},"steps":[{"name":"Download Compiled Windows & Linux Standalone Packages","uses":"actions/download-artifact@v4","with":{"path":"release_assets","merge-multiple":true}},{"name":"Generate SHA256SUMS, Remove v0.1.0-beta.1 & Publish v0.2.0-beta.1 Pre-Release","run":"cd release_assets && sha256sum Scash-P2Pool-v0.2.0-beta.1-* > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -lh && (gh release delete v0.1.0-beta.1 --yes --cleanup-tag || true) && NOTES='Out-of-the-box ~35 MB Windows x64 and Linux x64 standalone builds! Includes `xmrigMiner` & `xmrigDaemon` compiled directly from `ScashNetworkCommunity/xmrigCC` with `-DWITH_MSR=OFF` (zero `WinRing0x64.sys` kernel drivers), CMake-compiled `ScashNetworkCommunity/RandomX` (`randomx.dll` / `librandomx.so` verified against Scash Genesis Block `e3bf1597...`), and a bundled portable PyPy 2.7 + Twisted runtime so users do not need Python or any external miner download.' && if gh release view v0.2.0-beta.1 >/dev/null 2>&1; then gh release upload v0.2.0-beta.1 Scash-P2Pool-v0.2.0-beta.1-Windows-x64.zip Scash-P2Pool-v0.2.0-beta.1-Linux-x64.tar.gz SHA256SUMS.txt --clobber; else gh release create v0.2.0-beta.1 Scash-P2Pool-v0.2.0-beta.1-Windows-x64.zip Scash-P2Pool-v0.2.0-beta.1-Linux-x64.tar.gz SHA256SUMS.txt --title 'Scash P2Pool v0.2.0-beta.1 (Out-of-the-Box Standalone + Scash xmrigCC Pre-Release)' --notes \"$NOTES\" --prerelease --target master; fi"}]}}}
